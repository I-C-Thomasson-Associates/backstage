# ICTA fork: builds our Backstage app (icta-app/, a create-app app using Backstage from npm) into a GHCR image.
# Lives only on the `icta` branch so `master` can keep tracking upstream cleanly.
name: ICTA build image
on:
  push:
    branches: [icta]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/i-c-thomasson-associates/backstage

jobs:
  build:
    if: github.repository == 'I-C-Thomasson-Associates/backstage'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same Node major as icta-app/packages/backend/Dockerfile (native modules must match).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: corepack enable

      - name: yarn install
        working-directory: icta-app
        run: yarn install --immutable

      - working-directory: icta-app
        run: yarn tsc

      - name: Test ICTA sign-in org check
        working-directory: icta-app
        run: yarn workspace backend test src/githubOrgMembership
        env:
          CI: true

      - working-directory: icta-app
        run: yarn build:backend

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: icta-app
          file: icta-app/packages/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:icta
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest for backstage_image
        run: echo "\`${IMAGE}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
