# ICTA base config, baked into the image. Deployment-specific settings (URLs, database,
# GitHub sign-in, service token) come from the infra repo's ConfigMap, loaded after this file.
# No guest sign-in and no local example data on purpose.
app:
  title: Backstage
  baseUrl: http://localhost:7007
  packages: all
  extensions:
    # Backstage's standard home page at /, catalog at its default /catalog.
    # Same widgets as the create-app scaffold, minus Random Joke (it calls an external API).
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://backstage.io/docs
              label: Docs
              icon: docs
            - url: https://backstage.io/plugins
              label: Plugins Directory
              icon: kind:component
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: GettingStarted
              column: 0
              row: 1
              width: 4
              height: 11
            - component: HomePageStarredEntities
              column: 4
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageMostVisited
              column: 4
              row: 6
              width: 4
              height: 4
            - component: HomePageRecentlyVisited
              column: 8
              row: 6
              width: 4
              height: 4

organization:
  name: Salas O'Brien

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  database:
    client: better-sqlite3
    connection: ':memory:'
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  providers: {}
  clientIdMetadataDocuments:
    enabled: false

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User]
  locations: []

kubernetes:

permission:
  enabled: true

mcpActions:
  name: 'Salas O''Brien Backstage'
